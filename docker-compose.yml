networks:
  default:
    driver: bridge

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: media_notes
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d media_notes"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: mukI3zVZQx-6q9pdGOQp2w
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for host clients (go run ... on the host machine,
      # matching how postgres/redis/minio are reached below); INTERNAL is
      # for other containers on the default network. See
      # docs/local-infrastructure.md for the required topology.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - default
    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    networks:
      - default
    restart: unless-stopped

  redis:
    image: bitnamilegacy/redis:7.2.5
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redisadmin}
    networks:
      - default
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - default
    restart: unless-stopped

  # Every service below this point runs with network_mode: host instead of
  # joining the `default` bridge network: they use the exact same
  # `localhost:<port>` addresses as services/*/.env.example already assumes
  # for `go run` on the host, so presigned MinIO URLs media hands back stay
  # usable from a browser on the host too (the bridge-network alternative
  # signs them with the container-only hostname `minio`, which nothing
  # outside the compose network can resolve). This is the same fix v1's
  # `worker` service used. `ports:`/`networks:` are omitted on these
  # services — meaningless under host networking, since the container binds
  # the host's ports directly.

  identity-migrate:
    image: flyway/flyway:11
    container_name: identity-migrate
    profiles: ["app"]
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/identity/migrations:/flyway/migrations:ro
    command: >
      -url=jdbc:postgresql://localhost:5432/identity
      -user=identity -password=identity
      -locations=filesystem:/flyway/migrations
      -connectRetries=10
      migrate

  identity:
    build:
      context: .
      dockerfile: services/identity/identity.dockerfile
    container_name: identity
    profiles: ["app"]
    network_mode: host
    environment:
      DATABASE_URL: postgres://identity:identity@localhost:5432/identity?sslmode=disable
      KAFKA_BROKERS: localhost:9092
      IDENTITY_HTTP_ADDR: :8081
      IDENTITY_GRPC_ADDR: :9091
      LOG_LEVEL: info
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    restart: unless-stopped

  billing-migrate:
    image: flyway/flyway:11
    container_name: billing-migrate
    profiles: ["app"]
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/billing/migrations:/flyway/migrations:ro
    command: >
      -url=jdbc:postgresql://localhost:5432/billing
      -user=billing -password=billing
      -locations=filesystem:/flyway/migrations
      -connectRetries=10
      migrate

  billing:
    build:
      context: .
      dockerfile: services/billing/billing.dockerfile
    container_name: billing
    profiles: ["app"]
    network_mode: host
    environment:
      DATABASE_URL: postgres://billing:billing@localhost:5432/billing?sslmode=disable
      KAFKA_BROKERS: localhost:9092
      BILLING_HTTP_ADDR: :8082
      BILLING_GRPC_ADDR: :9093
      # Polar isn't needed to run the service — these are only used lazily,
      # per-request (webhook signature verification, checkout/plan-catalog
      # calls), never checked at startup.
      BILLING_POLAR_WEBHOOK_SECRET: ${BILLING_POLAR_WEBHOOK_SECRET:-}
      BILLING_POLAR_ACCESS_TOKEN: ${BILLING_POLAR_ACCESS_TOKEN:-}
      BILLING_POLAR_SERVER: ${BILLING_POLAR_SERVER:-sandbox}
      BILLING_POLAR_SUCCESS_URL: ${BILLING_POLAR_SUCCESS_URL:-http://localhost:3000/billing?checkout=success}
      LOG_LEVEL: info
    depends_on:
      billing-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    restart: unless-stopped

  media-migrate:
    image: flyway/flyway:11
    container_name: media-migrate
    profiles: ["app"]
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/media/migrations:/flyway/migrations:ro
    command: >
      -url=jdbc:postgresql://localhost:5432/media
      -user=media -password=media
      -locations=filesystem:/flyway/migrations
      -connectRetries=10
      migrate

  media:
    build:
      context: .
      dockerfile: services/media/media.dockerfile
    container_name: media
    profiles: ["app"]
    network_mode: host
    environment:
      DATABASE_URL: postgres://media:media@localhost:5432/media?sslmode=disable
      KAFKA_BROKERS: localhost:9092
      MEDIA_HTTP_ADDR: :8083
      MEDIA_GRPC_ADDR: :19095
      # localhost:9002 is minio's published S3-API port (see the minio
      # service's `ports:` above) — the same address a browser on the host
      # uses, so presigned URLs media signs are valid for both.
      MINIO_ENDPOINT: localhost:9002
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_USE_SSL: "false"
      MINIO_MEDIA_BUCKET: media
      LOG_LEVEL: info
    depends_on:
      media-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  content-migrate:
    image: flyway/flyway:11
    container_name: content-migrate
    profiles: ["app"]
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/content/migrations:/flyway/migrations:ro
    command: >
      -url=jdbc:postgresql://localhost:5432/content
      -user=content -password=content
      -locations=filesystem:/flyway/migrations
      -connectRetries=10
      migrate

  content:
    build:
      context: .
      dockerfile: services/content/content.dockerfile
    container_name: content
    profiles: ["app"]
    network_mode: host
    environment:
      DATABASE_URL: postgres://content:content@localhost:5432/content?sslmode=disable
      KAFKA_BROKERS: localhost:9092
      CONTENT_HTTP_ADDR: :8084
      CONTENT_GRPC_ADDR: :9095
      # Presigns summary-audio playback URLs (see internal/objectstore) —
      # same bucket media writes to, since worker uploads audio there.
      MINIO_ENDPOINT: localhost:9002
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_USE_SSL: "false"
      MINIO_MEDIA_BUCKET: media
      LOG_LEVEL: info
    depends_on:
      content-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  conductor-migrate:
    image: flyway/flyway:11
    container_name: conductor-migrate
    profiles: ["app"]
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/conductor/migrations:/flyway/migrations:ro
    command: >
      -url=jdbc:postgresql://localhost:5432/workflow
      -user=conductor -password=conductor
      -locations=filesystem:/flyway/migrations
      -connectRetries=10
      migrate

  conductor:
    build:
      context: .
      dockerfile: services/conductor/conductor.dockerfile
    container_name: conductor
    profiles: ["app"]
    network_mode: host
    environment:
      DATABASE_URL: postgres://conductor:conductor@localhost:5432/workflow?sslmode=disable
      KAFKA_BROKERS: localhost:9092
      CONDUCTOR_HTTP_ADDR: :8085
      # conductor calls media and billing as a gRPC client (it has no
      # gRPC server of its own) — see docs/services/conductor.md.
      CONDUCTOR_MEDIA_GRPC_ADDR: localhost:19095
      CONDUCTOR_BILLING_GRPC_ADDR: localhost:9093
      LOG_LEVEL: info
    depends_on:
      conductor-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    restart: unless-stopped

  # conductor-worker: the Python executor pool (Whisper/LLM/TTS/FFmpeg)
  # described in docs/services/worker.md, built from services/worker/.
  conductor-worker:
    build:
      context: .
      dockerfile: services/worker/worker.dockerfile
    container_name: conductor-worker
    profiles: ["app"]
    network_mode: host
    environment:
      KAFKA_BROKERS: localhost:9092
      WORKER_MEDIA_GRPC_ADDR: localhost:19095
      WORKER_CONTENT_GRPC_ADDR: localhost:9095
      MINIO_ENDPOINT: localhost:9002
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_USE_SSL: "false"
      MINIO_MEDIA_BUCKET: media
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WORKER_TTS_VOICE: en-US-AriaNeural
      LOG_LEVEL: info
    depends_on:
      kafka:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  hermes:
    build:
      context: .
      dockerfile: services/hermes/hermes.dockerfile
    container_name: hermes
    profiles: ["app"]
    network_mode: host
    environment:
      HERMES_HTTP_ADDR: :8086
      HERMES_IDENTITY_GRPC_ADDR: localhost:9091
      HERMES_BILLING_GRPC_ADDR: localhost:9093
      HERMES_MEDIA_GRPC_ADDR: localhost:19095
      HERMES_CONTENT_GRPC_ADDR: localhost:9095
      REDIS_ADDR: localhost:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redisadmin}
      LOG_LEVEL: info
    depends_on:
      identity:
        condition: service_started
      billing:
        condition: service_started
      media:
        condition: service_started
      content:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    container_name: web
    profiles: ["app"]
    network_mode: host
    depends_on:
      hermes:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:
