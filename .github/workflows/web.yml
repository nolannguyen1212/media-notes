name: web

on:
  push:
    branches: [master]
    paths:
      - services/web/**
      - services/hermes/internal/graphql/schema.graphqls
      - .github/workflows/web.yml
      - .github/workflows/release-service.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    uses: ./.github/workflows/release-service.yml
    with:
      image: media-notes-web
      dockerfile: services/web/Dockerfile
    secrets: inherit
