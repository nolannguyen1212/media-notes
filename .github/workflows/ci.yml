name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Codegen
        run: pnpm codegen

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Run tests
        run: pnpm test

  services:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/hermes/go.mod

      - name: Build every v2 service
        run: make build:v2

      - name: Test every v2 service
        run: make test:v2

  build-and-push:
    needs: [web, services]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: media-notes-identity
            dockerfile: services/identity/identity.dockerfile
          - image: media-notes-identity-migrate
            dockerfile: services/identity/identity-migrate.dockerfile
          - image: media-notes-billing
            dockerfile: services/billing/billing.dockerfile
          - image: media-notes-billing-migrate
            dockerfile: services/billing/billing-migrate.dockerfile
          - image: media-notes-media
            dockerfile: services/media/media.dockerfile
          - image: media-notes-media-migrate
            dockerfile: services/media/media-migrate.dockerfile
          - image: media-notes-content
            dockerfile: services/content/content.dockerfile
          - image: media-notes-content-migrate
            dockerfile: services/content/content-migrate.dockerfile
          - image: media-notes-conductor
            dockerfile: services/conductor/conductor.dockerfile
          - image: media-notes-conductor-migrate
            dockerfile: services/conductor/conductor-migrate.dockerfile
          - image: media-notes-conductor-worker
            dockerfile: services/worker/worker.dockerfile
          - image: media-notes-hermes
            dockerfile: services/hermes/hermes.dockerfile
          - image: media-notes-web
            dockerfile: services/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            VITE_HERMES_URL=https://medianotes.api.bbmonster.online
          tags: |
            ghcr.io/nolannguyen1212/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/nolannguyen1212/${{ matrix.image }}:latest
